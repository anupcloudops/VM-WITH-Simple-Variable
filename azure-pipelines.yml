trigger:
- main

pool: asr

steps:
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendAzureRmResourceGroupName: 'rg1'
    backendAzureRmStorageAccountName: 'sona88ranjeet'
    backendAzureRmContainerName: 'ranjeet'
    backendAzureRmKey: 'app.tfstate'
