# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool: asr

steps:

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: 'pwd'
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendAzureRmUseEntraIdForAuthentication: false
    backendAzureRmUseCliFlagsForAuthentication: true
    backendServiceArm: 'svc'
    backendAzureRmOverrideSubscriptionID: '05dbb74f-6152-4a1d-a1fd-c49be5c3fd99'
    backendAzureRmResourceGroupName: 'rg1'
    backendAzureRmStorageAccountName: 'sonal88ranjeet'
    backendAzureRmContainerName: 'ranjeet'
    backendAzureRmKey: 'app.tfstate'
