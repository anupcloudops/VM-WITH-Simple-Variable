trigger:
- main

pool: asr

stages:
  - stage: terraform_install
    jobs:


      - job: dependency_install
        displayName: install
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'

      - job: terraform_fmt
        displayName: fmt
        dependsOn: dependency_install
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'svc'
            backendAzureRmResourceGroupName: 'for-backend'
            backendAzureRmStorageAccountName: 'pipelinekeliye'
            backendAzureRmContainerName: 'pipestorage'
            backendAzureRmKey: 'rtp.tfstate'

  - stage: init_plan
    jobs:
     - job: init
       steps:

       - task: TerraformTask@5
         inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'svc'
            backendAzureRmResourceGroupName: 'for-backend'
            backendAzureRmStorageAccountName: 'pipelinekeliye'
            backendAzureRmContainerName: 'pipestorage'
            backendAzureRmKey: 'rtp.tfstate'

       - task: TerraformTask@5
         inputs:
           provider: 'azurerm'
           command: 'plan'
           environmentServiceNameAzureRM: 'svc'

  -  stage: terraform_apply
     jobs:
      - job: manual
        pool: server
        displayName: validation
        timeoutInMinutes: 1
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'Anup'
            approvers: 'anup@vaishalikahakar91outlook.onmicrosoft.com'
      - job: apply
        displayName: apply
        dependsOn: manual
        condition: and(succeeded(),
          eq(variables['Build.SourceBranch'], 'refs/heads/main'))

        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'svc'
            backendAzureRmResourceGroupName: 'for-backend'
            backendAzureRmStorageAccountName: 'pipelinekeliye'
            backendAzureRmContainerName: 'pipestorage'
            backendAzureRmKey: 'rtp.tfstate'